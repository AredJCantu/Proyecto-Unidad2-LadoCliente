<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Playlist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #121212;
            --bg-sidebar: #000000;
            --bg-hover: #282828;
            --text-main: #FFFFFF;
            --text-muted: #B3B3B3;
            --spotify-green: #1DB954;
            --spotify-green-hover: #1ED760;
            --border-color: #333333;
            --danger-red: #e91429;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR (FORMULARIO) --- */
        .sidebar {
            width: 320px;
            background-color: var(--bg-sidebar);
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
        }

        .sidebar h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .form-group input {
            width: 100%;
            background-color: #242424;
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--text-muted);
        }

        .form-group input::placeholder {
            color: #7a7a7a;
        }

        .btn-add {
            background-color: var(--spotify-green);
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: 500px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-add:hover {
            background-color: var(--spotify-green-hover);
            transform: scale(1.02);
        }

        /* --- MAIN CONTENT (LISTA) --- */
        .main-content {
            flex: 1;
            padding: 32px 48px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            gap: 24px;
        }

        .top-bar h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .search-container {
            flex: 1;
            max-width: 400px;
            position: relative;
        }

        .search-container input {
            width: 100%;
            background-color: #242424;
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 12px 16px 12px 40px;
            border-radius: 500px;
            font-size: 14px;
        }

        .search-container input:focus {
            outline: none;
            border-color: var(--text-muted);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            fill: var(--text-muted);
            width: 16px;
            height: 16px;
        }

        .btn-shuffle {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--text-muted);
            padding: 10px 20px;
            border-radius: 500px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-shuffle:hover {
            border-color: var(--text-main);
            transform: scale(1.04);
        }

        /* --- LISTA DE CANCIONES --- */
        .playlist-header {
            display: grid;
            grid-template-columns: 40px 1fr 150px;
            padding: 0 16px 8px 16px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .song-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .song-item {
            display: grid;
            grid-template-columns: 40px 1fr 150px;
            align-items: center;
            padding: 12px 16px;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }

        .song-item:hover {
            background-color: var(--bg-hover);
        }

        .song-number {
            color: var(--text-muted);
            font-size: 16px;
        }

        .song-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .song-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
        }

        .song-artist {
            font-size: 14px;
            color: var(--text-muted);
        }

        .song-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .song-item:hover .song-actions {
            opacity: 1;
            /* Los botones aparecen al hacer hover */
        }

        .action-btn {
            background-color: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            font-weight: bold;
        }

        .action-btn:hover {
            color: var(--text-main);
            border-color: var(--text-main);
            transform: scale(1.1);
        }

        .action-btn.delete {
            color: var(--danger-red);
            border-color: var(--danger-red);
        }

        .action-btn.delete:hover {
            background-color: var(--danger-red);
            color: var(--text-main);
        }

        /* Scrollbar personalizada */
        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background-color: #4d4d4d;
            border-radius: 10px;
            border: 3px solid var(--bg-main);
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: #7a7a7a;
        }
    </style>
</head>

<body>

    <!-- SIDEBAR (FORMULARIO) -->
    <aside class="sidebar">
        <h2>Añadir a la Playlist</h2>

        <form>
            <div class="form-group">
                <label for="songName">Nombre de la canción</label>
                <input type="text" id="songName" placeholder="Ej. Bohemian Rhapsody" required>
            </div>

            <div class="form-group">
                <label for="artistName">Artista</label>
                <input type="text" id="artistName" placeholder="Ej. Queen" required>
            </div>

            <button type="button" id="addSong" class="btn-add">Añadir a la Playlist</button>
        </form>
    </aside>

    <!-- MAIN CONTENT (LISTA DE REPRODUCCIÓN) -->
    <main class="main-content">

        <div class="top-bar">
            <h1>Mi Playlist</h1>

            <div class="search-container">
                <svg class="search-icon" viewBox="0 0 24 24">
                    <path
                        d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                </svg>
                <input id="barra-busqueda" type="text" placeholder="Buscar por canción o artista...">
            </div>

            <button id="mezclar" type="button" class="btn-shuffle">
                <!-- Icono de flechas cruzadas para mezclar -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z" />
                </svg>
                Mezclar
            </button>
        </div>

        <!-- Encabezados de la lista -->
        <div class="playlist-header">
            <span>#</span>
            <span>Título</span>
            <span style="text-align: right; padding-right: 16px;">Acciones</span>
        </div>

        <ul class="song-list">
         
        </ul>

    </main>
    <script>
        const txtSong = document.getElementById("songName");
        const txtArtist = document.getElementById("artistName");
        const searchbar = document.getElementById("barra-busqueda");
        const btnShuffle = document.getElementById("mezclar");
        const btnAdd = document.getElementById("addSong");
        const docSongs = document.querySelector(".song-list");

        let listSongs = JSON.parse(localStorage.getItem("songs")) ?? [];

        // <li class="song-item">
        //     <span class="song-number">3</span>
        //     <div class="song-info">
        //         <span class="song-title">Bohemian Rhapsody</span>
        //         <span class="song-artist">Queen</span>
        //     </div>
        //     <div class="song-actions">
        //         <button class="action-btn" title="Subir">▲</button>
        //         <button class="action-btn" title="Bajar">▼</button>
        //         <button class="action-btn delete" title="Eliminar">✕</button>
        //     </div>
        // </li>
        const filterSongs=()=>{
            if(searchbar.value===""){
                loadSongs(listSongs);
                return;
            }
            let text=searchbar.value.toUpperCase();
            let filtered=listSongs.filter(item=>(item.Title.toUpperCase().includes(text))||(item.Artist.toUpperCase().includes(text)));
            
            loadSongs(filtered);
        }
        searchbar.addEventListener("input",()=>{
            filterSongs();
        })
        
        btnAdd.addEventListener("click",()=>{
            if(txtArtist.value==""||txtSong.value==""){
                alert("Por favor, rellene los campos de artista y titulo.");
                return;
            }else{
                let newSong={
                    "Title":txtSong.value,
                    "Artist":txtArtist.value
                };
                listSongs.push(newSong);
                txtSong.value="";
                txtArtist.value="";
                filterSongs()
                localStorage.setItem("songs",JSON.stringify(listSongs));

            }
        })
        btnShuffle.addEventListener("click",()=>{
            listSongs.sort(() => Math.random() - 0.5);
            loadSongs(listSongs);
            localStorage.setItem("songs",JSON.stringify(listSongs));
        })
        const up=(id)=>{
            if(id==0){
                return;
            }else{
                let nextSong=listSongs[id-1];
                listSongs[id-1]=listSongs[id];
                listSongs[id]=nextSong;
            }
            loadSongs(listSongs);
            localStorage.setItem("songs",JSON.stringify(listSongs));
        }
        const down=(id)=>{
            if(id==listSongs.length-1){
                return;
            }else{
                let nextSong=listSongs[id+1];
                listSongs[id+1]=listSongs[id];
                listSongs[id]=nextSong;
            }
            loadSongs(listSongs);
            localStorage.setItem("songs",JSON.stringify(listSongs));
        }
        const del=(id)=>{
            listSongs.splice(id,1)
            loadSongs(listSongs);
            localStorage.setItem("songs",JSON.stringify(listSongs));
        }

        const loadSongs = (listParameter) => {
            docSongs.innerHTML = "";
            listParameter.forEach((element, id) => {
                let Li = document.createElement("li");
                Li.className = "song-item";
                let spanId=document.createElement("span");
                spanId.className="song-number";
                spanId.textContent=id+1;
                //Song info
                let divInfo=document.createElement("div");
                divInfo.className="song-info";
                let spanTitle=document.createElement("span");
                let spanArtist=document.createElement("span");
                spanTitle.className="song-title";
                spanTitle.textContent=element.Title;
                spanArtist.className="song-artist";
                spanArtist.textContent=element.Artist;
                divInfo.append(spanTitle);
                divInfo.append(spanArtist);

                //Actions
                let divActions=document.createElement("div");
                divActions.className="song-actions";
                let btnUp=document.createElement("button");
                btnUp.title="Subir";
                btnUp.textContent="▲";
                btnUp.className="action-btn";
                btnUp.addEventListener("click",()=>{up(id)});
                let btnDown=document.createElement("button");
                 btnDown.title="Bajar";
                 btnDown.textContent="▼";
                btnDown.className="action-btn";
                btnDown.addEventListener("click",()=>{down(id)});
                let btnDelete=document.createElement("button");
                 btnDelete.title="Eliminar";
                 btnDelete.textContent="✕";
                btnDelete.className="action-btn";
                btnDelete.classList.add("delete");
                btnDelete.addEventListener("click",()=>{del(id)});
                divActions.append(btnUp);
                divActions.append(btnDown);
                divActions.append(btnDelete);

                Li.append(spanId);
                Li.append(divInfo);
                Li.append(divActions);

                docSongs.append(Li);
            });
        };

        loadSongs(listSongs);
    </script>
</body>

</html>
