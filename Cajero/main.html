<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cajero Principal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --forest-green: #1f3d2b;
            --sand-beige: #e8dcc4;
            --electric-purple: #8b5cf6;
            --destructive: #ef4444;
        }

        body {
            background: linear-gradient(135deg, #1f3d2b 0%, #0d1f14 100%);
            color: var(--sand-beige);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .dashboard {
            width: 100%;
            max-width: 500px;
        }

        .balance-card {
            background: linear-gradient(145deg, #e8dcc4 0%, #d4c5a9 100%);
            color: var(--forest-green);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .balance-card h2 {
            margin: 0 0 10px 0;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-card .amount {
            font-size: 42px;
            font-weight: 700;
            margin: 0;
        }

        .actions {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .history-card {
            background: linear-gradient(145deg, #e8dcc4 0%, #d4c5a9 100%);
            color: var(--forest-green);
            padding: 24px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .history-card h3 {
            margin-top: 0;
            font-weight: 700;
            border-bottom: 2px solid rgba(31, 61, 43, 0.1);
            padding-bottom: 12px;
            margin-bottom: 0;
        }

        .history-card ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        /* --- NUEVOS ESTILOS DE LA LISTA (ESTILO APP BANCARIA) --- */
        .history-card li {
            padding: 16px 0;
            border-bottom: 1px solid rgba(31, 61, 43, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-card li:last-child {
            border-bottom: none;
            padding-bottom: 4px;
        }

        .trans-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .trans-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: 700;
        }

        /* Icono Depósito (Fondo verde suave, texto verde) */
        .trans-icon.deposit {
            background-color: rgba(31, 61, 43, 0.1);
            color: var(--forest-green);
        }

        /* Icono Retiro (Fondo rojo suave, texto rojo) */
        .trans-icon.withdraw {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--destructive);
        }

        .trans-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .trans-type {
            font-weight: 600;
            font-size: 15px;
        }

        .trans-date {
            font-size: 12px;
            font-weight: 400;
            color: rgba(31, 61, 43, 0.6);
        }

        .trans-amount {
            font-weight: 700;
            font-size: 16px;
        }

        .trans-amount.deposit {
            color: var(--forest-green);
        }

        .trans-amount.withdraw {
            color: var(--destructive);
        }

        /* --- SISTEMA DE BOTONES --- */
        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            text-decoration: none;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .btn-default {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            width: 100%;
        }

        .btn-default:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--sand-beige);
            border-color: var(--sand-beige);
            flex: 1;
        }

        .btn-secondary:hover {
            background-color: rgba(232, 220, 196, 0.1);
        }

        .btn-ghost {
            background-color: transparent;
            color: var(--forest-green);
            padding: 8px;
            border: none;
            font-size: 24px;
            line-height: 1;
        }

        .btn-ghost:hover {
            opacity: 0.7;
        }

        .btn-destructive {
            background-color: transparent;
            color: var(--destructive);
            border-color: var(--destructive);
            width: 100%;
        }

        .btn-destructive:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }

        /* --- ESTILOS DEL MODAL --- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(31, 61, 43, 0.95) 0%, rgba(13, 31, 20, 0.95) 100%);
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(4px);
        }

        .modal:target {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(145deg, #e8dcc4 0%, #d4c5a9 100%);
            color: var(--forest-green);
            padding: 35px 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 320px;
            position: relative;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .modal-content h2 {
            margin-top: 0;
            text-align: center;
            font-weight: 700;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .modal-content input {
            width: 100%;
            padding: 14px;
            border: 2px solid transparent;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 18px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            margin-bottom: 24px;
            background-color: #ffffff;
            color: var(--forest-green);
        }

        .modal-content input:focus {
            outline: none;
            border-color: var(--electric-purple);
        }

        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .close-ghost {
            position: absolute;
            top: 15px;
            right: 15px;
        }

        .hidden {
            visibility: collapse;
            display: none;
        }
    </style>
</head>

<body>

    <div class="dashboard">
        <div class="balance-card">
            <h2>Saldo disponible</h2>
            <p class="amount">$0</p>
        </div>

        <div class="actions">
            <a href="#modal" id="Retirar" class="btn btn-secondary">Retirar</a>
            <a href="#modal" id="Depositar" class="btn btn-secondary">Depositar</a>
        </div>

        <div class="history-card">
            <h3>Últimas operaciones</h3>
            <ul id="List-Trans">
                <!-- Aquí se inyectan las transacciones -->
            </ul>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <a href="#" class="btn btn-ghost close-ghost">&times;</a>

            <h2>Ingresa la cantidad</h2>

            <input type="number" id="InputSaldo" placeholder="$0.00" required>

            <div class="modal-actions">
                <a id="btnDepositar" class="btn btn-default">Confirmar</a>
                <a id="btnRetirar" class="btn btn-default">Confirmar</a>
                <a href="#" class="btn btn-destructive">Cancelar</a>
            </div>

        </div>
    </div>

    <script>
        const verRetirar = document.getElementById("Retirar");
        const verDepositar = document.getElementById("Depositar");
        const txtAmount = document.querySelector(".amount");
        const docList = document.getElementById("List-Trans");
        //Formulario
        const txtSaldo = document.getElementById("InputSaldo");
        const btnDeposit = document.getElementById("btnDepositar");
        const btnWithdraw = document.getElementById("btnRetirar");

        let Total = 0;
        let Lista = [];
        let contenido = JSON.parse(localStorage.getItem("usuario"));

        const renderizarLista = () => {
            txtAmount.textContent = "$" + Total;
            docList.innerHTML = "";
            Lista.forEach(valor => {
                let li = document.createElement("li");

                // Contenedor Izquierdo (Icono + Textos)
                let leftDiv = document.createElement("div");
                leftDiv.className = "trans-left";

                let icon = document.createElement("div");
                icon.className = valor.Type === "Deposito" ? "trans-icon deposit" : "trans-icon withdraw";
                icon.textContent = valor.Type === "Deposito" ? "↓" : "↑";

                let infoDiv = document.createElement("div");
                infoDiv.className = "trans-info";

                let typeSpan = document.createElement("span");
                typeSpan.className = "trans-type";
                typeSpan.textContent = valor.Type;

                let dateSpan = document.createElement("span");
                dateSpan.className = "trans-date";

                // Formateo de fecha seguro(Si viene la fecha en string desde el localstorage)
                let dateObj = valor.Date ? new Date(valor.Date) : new Date();
                let options = {day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'};
                dateSpan.textContent = dateObj.toLocaleDateString('es-ES', options);

                infoDiv.appendChild(typeSpan);
                infoDiv.appendChild(dateSpan);

                leftDiv.appendChild(icon);
                leftDiv.appendChild(infoDiv);

                // Contenedor Derecho (Cantidad)
                let amountSpan = document.createElement("span");
                amountSpan.className = valor.Type === "Deposito" ? "trans-amount deposit" : "trans-amount withdraw";
                amountSpan.textContent = (valor.Type == "Deposito" ? "+$" : "-$") + valor.amount;

                li.appendChild(leftDiv);
                li.appendChild(amountSpan);

                docList.appendChild(li);
            });
         
        }
        const guardar=()=>{
               //Guardar
            let nuevoObjeto={
                        "estado": true,
                        "saldo": Total,
                        "Lista": Lista
                    };
            localStorage.setItem("usuario", JSON.stringify(nuevoObjeto));
        }
        verDepositar.addEventListener("click", () => {
            btnDeposit.classList.remove('hidden');
            btnWithdraw.classList.add('hidden');
        });

        verRetirar.addEventListener("click", () => {
            btnDeposit.classList.add('hidden');
            btnWithdraw.classList.remove('hidden');
        });

        btnDeposit.addEventListener("click", () => {
            if (txtSaldo.value <= 0) {
                alert("Ingrese una cantidad valida")
                txtSaldo.value = "";
                window.location.href = "#modal";
            } else {
                if(Lista.length==5){
                    Lista.splice(0,1)
                }
                Lista.push({
                    "amount": txtSaldo.value,
                    "Type": "Deposito",
                    "Date": new Date()
                });
                Total = Total + parseFloat(txtSaldo.value);
                renderizarLista();
                txtSaldo.value = "";
                window.location.href = "#";
                guardar()
            }
        });

        btnWithdraw.addEventListener("click", () => {
            if (txtSaldo.value <= 0) {
                alert("Ingrese una cantidad valida")
                window.location.href = "#modal";
                txtSaldo.value = "";
            }
            else {
                if (txtSaldo.value > Total) {
                    alert(`No puede retirarlo, porque su cuenta solo tiene : $${Total}`);
                } else {
                     if(Lista.length==5){
                    Lista.splice(0,1)
                }
                    Lista.push({
                        "amount": txtSaldo.value,
                        "Type": "Retiro",
                        "Date": new Date()
                    });
                    Total = Total - parseFloat(txtSaldo.value);
                    renderizarLista();
                    txtSaldo.value = "";
                    window.location.href = "#";
                    guardar()
                }
            }
        });

        if (contenido) {
            Lista = contenido.Lista;
            Total = parseFloat(contenido.saldo);
            renderizarLista();
        } else {
            renderizarLista();
            window.location.href = "./login.html";
        }
    </script>
</body>

</html>
